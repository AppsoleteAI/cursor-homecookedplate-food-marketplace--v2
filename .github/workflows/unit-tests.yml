name: Unit tests

# Manual only. A push must not start GitHub Actions for the website publish.
on:
  workflow_dispatch:

jobs:
  unit:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests and print coverage
        run: npm test -- --coverage
