name: Unit tests

# Runs the existing Jest suite and prints coverage. It does not deploy.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests and print coverage
        run: npm test -- --coverage
