name: Store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform
        required: true
        type: choice
        options:
          - ios
          - android

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run hardening checks
        run: npx jest backend/lib/__tests__/hardening.test.ts backend/lib/__tests__/launch-guards.test.ts --watchman=false

  store:
    needs: hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a store build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PUBLIC_SENTRY_DSN"
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          # The production profile reads this environment inside the EAS builder,
          # where the Sentry plugin uploads source maps for the release build.
          sync_env() {
            name="$1"
            value="$2"
            visibility="$3"
            npx --yes eas-cli@16.28.0 env:create \
              --environment production \
              --name "$name" \
              --value "$value" \
              --visibility "$visibility" \
              --type string \
              --non-interactive \
              --force \
            || npx --yes eas-cli@16.28.0 env:update \
              --environment production \
              --variable-name "$name" \
              --value "$value" \
              --visibility "$visibility" \
              --non-interactive
          }
          sync_env EXPO_PUBLIC_SENTRY_DSN "$EXPO_PUBLIC_SENTRY_DSN" plaintext
          sync_env SENTRY_AUTH_TOKEN "$SENTRY_AUTH_TOKEN" secret
          sync_env SENTRY_ORG "$SENTRY_ORG" plaintext
          sync_env SENTRY_PROJECT "$SENTRY_PROJECT" plaintext
          sync_env SENTRY_DISABLE_AUTO_UPLOAD false plaintext
          npx --yes eas-cli@16.28.0 build --non-interactive --platform "${{ inputs.platform }}" --profile production --no-wait
