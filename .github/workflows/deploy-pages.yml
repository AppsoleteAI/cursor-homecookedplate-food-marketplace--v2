name: Deploy Pages

# Cloudflare Pages publishes homecookedplate from the Git connection.
# This workflow does not run on push, so GitHub does not upload a second copy.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    env:
      CI: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "70d5534104320c1924d2737c4b524a5a"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --no-banner --redact=100 --config .gitleaks.toml .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require publish configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - run: npm ci
      - run: npm run pages:build
      - run: npx wrangler --config wrangler.toml pages deploy dist --project-name homecookedplate --branch main --commit-hash "$GITHUB_SHA"
