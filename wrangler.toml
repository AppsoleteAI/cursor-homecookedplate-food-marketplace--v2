name = "homecookedplate"
pages_build_output_dir = "./dist"
compatibility_date = "2024-09-23"

# Cloudflare Pages publishes this site from the Git connection when main is pushed.
# GitHub Actions does not upload a second copy. EAS publishes the iOS and Android apps.
# API routes on homecookedplate.pages.dev call the Worker. This file does not publish that Worker.
[[services]]
binding = "API"
service = "plate-marketplace-api"
